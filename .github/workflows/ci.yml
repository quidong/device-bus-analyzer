name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --prefix extension
      - run: pytest -q
        env: { DBA_MANIFEST_BY_CI: "1" }        # manifest and signature are produced by the knowledge-sign workflow
      - run: dba validate-spec bshdbus && dba validate-spec macs
      - run: if ls contributions/*/*.json >/dev/null 2>&1; then dba validate-contribution contributions/*/*.json; fi
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t device-bus-analyzer .
