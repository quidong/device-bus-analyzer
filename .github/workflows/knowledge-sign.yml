# Keeps knowledge-manifest.json (+ .sig) in step with specs, catalogue and firmware, and signs it with the repository secret
# DBA_SIGNING_KEY (private Ed25519 key from `dba knowledge-keygen`). Installations only accept updates signed by the matching public key.
name: knowledge-sign
on:
  push:
    branches: [main]
    paths: ["src/device_bus_analyzer/spec/**", "src/device_bus_analyzer/catalog.yaml", "src/device_bus_analyzer/firmware/**"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: knowledge-sign
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Build and sign the manifest
        env:
          DBA_SIGNING_KEY: ${{ secrets.DBA_SIGNING_KEY }}
        run: |
          if [ -n "$DBA_SIGNING_KEY" ]; then
            umask 077; printf '%s\n' "$DBA_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"
            dba build-knowledge --sign "$RUNNER_TEMP/signing.pem"; rm -f "$RUNNER_TEMP/signing.pem"
          else
            echo "::warning::secret DBA_SIGNING_KEY not set: manifest built but not signed"; dba build-knowledge
          fi
      - name: Verify the result (manifest matches, signature valid)
        run: pytest -q tests/test_knowledge.py tests/test_knowledge_signing.py
        env: { DBA_MANIFEST_BY_CI: "0" }
      - name: Commit and rebuild the image when something changed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/device_bus_analyzer/knowledge-manifest.json src/device_bus_analyzer/knowledge-manifest.json.sig
            git commit -m "knowledge: manifest and signature [skip ci]"; git push
            gh workflow run image.yml --ref main      # a push by GITHUB_TOKEN does not start workflows itself
          fi
