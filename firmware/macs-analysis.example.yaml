# Trockner am Electrolux/AEG-MACS-Bus – ESP32-C6-Platine "MACS-ESP32-C6" (nur Mitlesen)
# Gegenstück zu bshdbus-analysis.example.yaml: schreibt jeden Frame roh in den Log (Logformat 1, docs/LOGFORMAT.md),
# damit der Sammler ihn speichern und der Analyzer ihn dekodieren kann, und stellt die wenigen Werte, die schon
# verstanden sind (Zustand, Programmnummer), als Home-Assistant-Sensoren bereit.
#
# Benötigt macs_recorder.h im selben Ordner wie diese Datei (ESPHome Device Builder: Datei neben die YAML legen).
# Eigene Schlüssel/Passwörter liegen in secrets.yaml. Die Platine hängt am Bus und ist nur an, solange der Trockner an ist.
#
# Platine: MACS RX = GPIO18 (invertiert), MACS TX = GPIO19 (wird nie benutzt), Status-LED grün = GPIO8 (aktiv low),
# Bus-Aktivität blau = GPIO21, 12-V-Erkennung = GPIO0 (Teiler 33k/10k).

substitutions:
  name: trockner
  friendly_name: Trockner

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - macs_recorder.h

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    uart_debug: WARN        # die Rohzeilen kommen vom Rekorder (RAW1), nicht vom uart_debug-Standardlog

api:
  encryption:
    key: !secret trockner_api_key

ota:
  - platform: esphome
    password: !secret trockner_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # Optional, wenn der Name nicht über VLAN-Grenzen aufgelöst wird:
  # use_address: !secret trockner_address
  ap:
    ssid: "Trockner Fallback"
    password: !secret trockner_ap_password

captive_portal:

debug:
  update_interval: 60s

status_led:
  pin:
    number: GPIO8
    inverted: true

output:
  - platform: gpio
    pin: GPIO21
    id: led_act

script:
  - id: blink_act
    mode: restart
    then:
      - output.turn_on: led_act
      - delay: 60ms
      - output.turn_off: led_act

# Absolute Zeit von Home Assistant (für die Epoch-Angabe im Heartbeat)
time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: macs_rec
    type: macs::Recorder

uart:
  id: uart_macs
  rx_pin:
    number: GPIO18
    inverted: true          # Bus ist invertiert (Ruhe = 0 V)
  tx_pin:
    number: GPIO19
    inverted: true          # Ruhe -> GPIO low -> Treiber aus; es wird nie gesendet
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 5ms          # nur Stückelung der UART-Callbacks; Frames setzt der Rekorder anhand der Länge zusammen
    sequence:
      - lambda: id(macs_rec).on_bytes(bytes, micros(), millis());
      - script.execute: blink_act

interval:
  # Bytes, die nach 40 ms Ruhe noch festhängen (Frame ohne ACK, Rauschen), freigeben
  - interval: 20ms
    then:
      - lambda: id(macs_rec).on_idle(micros(), millis());
  # Heartbeat: Zähler und absolute Zeit (zeigt Lücken im Sammler)
  - interval: 60s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          id(macs_rec).heartbeat(micros(), t.is_valid() ? (long long) t.timestamp : 0);

sensor:
  - platform: adc
    pin: GPIO0
    id: v12_raw
    name: "Bus 12V"
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 4.3       # Teiler 33k/10k
    unit_of_measurement: "V"
    accuracy_decimals: 1
  # Programmnummer (22/2a50 Byte 13, bestätigt; Namen der Programme sind noch nicht zugeordnet)
  - platform: template
    name: "Programmnummer"
    icon: mdi:tumble-dryer
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(macs_rec).program < 0) return {};
      return (float) id(macs_rec).program;
  # ANALYSE: Zähler seit Neustart – zeigt in HA, ob der Bus schweigt oder gestört ist
  - platform: template
    name: "MACS Frames gültig"
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) id(macs_rec).c.ok;
  - platform: template
    name: "MACS Frames Prüfsummenfehler"
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) id(macs_rec).c.crc;
  - platform: template
    name: "MACS Frames ohne ACK"
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) id(macs_rec).c.noack;
  - platform: template
    name: "MACS Restbytes"
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) id(macs_rec).c.rest;
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"

binary_sensor:
  - platform: template
    name: "Gerät versorgt"
    lambda: return id(v12_raw).state > 9.0;
  # Läuft: Gerätezustand 02 (angenommen, aus einer Aufnahme: 01 bereit, 02 läuft, 04 pausiert, 0b aus)
  - platform: template
    name: "Läuft"
    device_class: running
    lambda: return id(macs_rec).state == 0x02;
  - platform: template
    name: "Kompressor-Board aktiv"
    entity_category: diagnostic
    lambda: return id(macs_rec).inverter_seen;

text_sensor:
  - platform: template
    name: "Zustand"
    icon: mdi:state-machine
    update_interval: 5s
    lambda: |-
      switch (id(macs_rec).state) {
        case 0x0B: return std::string("aus");
        case 0x01: return std::string("bereit");
        case 0x02: return std::string("läuft");
        case 0x04: return std::string("pausiert");
        case -1: return {};
        default: return str_sprintf("unbekannt (0x%02X)", id(macs_rec).state);
      }
  - platform: debug
    reset_reason:
      name: "Neustartgrund"

button:
  - platform: restart
    name: "Neustart"
