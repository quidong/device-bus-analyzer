# MACS-ESP32-C6 – universeller Bus-Mitschnitt (alle Geräte)
#
# Schreibt jedes empfangene Byte als Hex in das ESPHome-Log und zählt Frames.
# Damit lassen sich unbekannte Geräte (Backofen, Kochfeld, Trockner, …)
# aufzeichnen, bevor ein Decoder existiert.
#
# Platine v1.2: MACS RX = GPIO18 (Teiler 4k7/10k + 1 nF), MACS TX = GPIO19
#           Status-LED = GPIO8 (aktiv low), Bus-Aktivität = GPIO21 (aktiv high),
#           12-V-Erkennung = GPIO0 (ADC), Power-LED fest an 3,3 V

substitutions:
  name: macs-sniffer
  friendly_name: "MACS Sniffer"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB          # ESP32-C6-WROOM-1-N8
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"

captive_portal:

status_led:
  pin:
    number: GPIO8
    inverted: true

# Blaue LED: blinkt kurz bei Busverkehr
output:
  - platform: gpio
    pin: GPIO21
    id: led_act

script:
  - id: blink_act
    mode: restart
    then:
      - output.turn_on: led_act
      - delay: 60ms
      - output.turn_off: led_act

uart:
  id: uart_macs
  rx_pin:
    number: GPIO18
    inverted: true          # Bus ist invertiert (Ruhe = 0 V)
  tx_pin:
    number: GPIO19
    inverted: true          # Ruhe -> GPIO low -> Treiber aus
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 5ms          # ein Frame = Bytes ohne Pause > 5 ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');
      - script.execute: blink_act

sensor:
  - platform: adc
    pin: GPIO0
    id: v12_raw
    name: "Bus 12V"
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 4.3       # Teiler 33k/10k
    unit_of_measurement: "V"
    accuracy_decimals: 1

binary_sensor:
  - platform: template
    name: "Gerät versorgt"
    lambda: return id(v12_raw).state > 9.0;
