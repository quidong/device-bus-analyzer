# MACS-ESP32-C6 – Waschmaschine (Electrolux/AEG/Zanussi, EWX-Steuerung)
#
# Nutzt die ESPHome-Komponente von agocsdaniel/esphome_electrolux_macs
# (getestet dort mit EWX14 / EW6SN347SHI). Für Trockner (EDR) das
# Beispiel example_electrolux_edr10_blue_tc3_esp32.yaml aus dem Repo
# übernehmen und nur den uart-Block unten ersetzen.

substitutions:
  name: macs-waschmaschine
  friendly_name: "Waschmaschine"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  - source: github://agocsdaniel/esphome_electrolux_macs

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB          # ESP32-C6-WROOM-1-N8
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"

captive_portal:

status_led:
  pin:
    number: GPIO8
    inverted: true

# Blaue LED: blinkt kurz bei Busverkehr
output:
  - platform: gpio
    pin: GPIO21
    id: led_act

script:
  - id: blink_act
    mode: restart
    then:
      - output.turn_on: led_act
      - delay: 60ms
      - output.turn_off: led_act

# --- Platinenspezifisch -----------------------------------------------------
uart:
  id: uart_macs
  rx_pin:
    number: GPIO18
    inverted: true
  tx_pin:
    number: GPIO19
    inverted: true          # Treiber auf der Platine, kein open-drain nötig
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1
  debug:                    # nur für die Aktivitäts-LED
    direction: RX
    after:
      timeout: 5ms
    sequence:
      - script.execute: blink_act

electrolux_washing_machine_macs:
  uart_id: uart_macs

sensor:
  - platform: electrolux_washing_machine_macs
    selected_program_number:
      name: "Programmnummer"
    remaining_time:
      name: "Restzeit"
    start_delay_time:
      name: "Startverzögerung"
    time_manager:
      name: "Time Manager"
    wash_temperature:
      name: "Waschtemperatur"
    spin_speed:
      name: "Schleuderdrehzahl"
  - platform: adc
    pin: GPIO0
    name: "Bus 12V"
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 4.3
    unit_of_measurement: "V"
    accuracy_decimals: 1

binary_sensor:
  - platform: electrolux_washing_machine_macs
    powered_on:
      name: "Eingeschaltet"
    running:
      name: "Läuft"
    door_locked:
      name: "Tür verriegelt"
    pre_wash_enabled:
      name: "Vorwäsche"
    stain_wash:
      name: "Flecken"
    extra_rinse:
      name: "Extra spülen"
    soft_plus:
      name: "Soft Plus"
    easy_iron:
      name: "Bügelleicht"
