[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-bus-analyzer"
version = "0.1.0"
description = "Collect, store, decode and inspect raw appliance-bus telegrams (BSH D-Bus, Electrolux MACS) read-only"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aioesphomeapi>=24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "argon2-cffi>=23.1",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/quidong/device-bus-analyzer"
Issues = "https://github.com/quidong/device-bus-analyzer/issues"

[project.scripts]
dba = "device_bus_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
device_bus_analyzer = ["spec/*.yaml", "catalog.yaml", "templates/*.html", "static/*", "firmware/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
