      - {id: program,    de: "Programm gewählt",    en: "Program selected", es: "Programa elegido", fr: "Programme choisi", it: "Programma scelto",   ask: true}
      - {id: option_on,  de: "Option eingeschaltet", en: "Option switched on", es: "Opción activada", fr: "Option activée", it: "Opzione attivata", ask: true, by_note: true, pair: option_off}
