# Protocol findings for the BSH D-Bus. Source of truth for the decoder AND the findings page.
# status: confirmed = verified against several recorded runs; assumed = plausible, not yet verified;
#         unknown   = seen on the bus, meaning not understood.
# Device-specific notes name the model they were observed on. Nothing in here may contain private data.
protocol: bshdbus
title: BSH D-Bus (Bosch / Siemens / Neff)
physical: "9600 baud, 8N1, half duplex, idle gap 15 ms ends a burst"
frame: "LL DS CC CC data... CRC16-XMODEM(LL..data); total length LL+4; ACK byte with low nibble 0xA. Upstream (hn) also lists 0x3 = frame exceeds the receive buffer and 0x7 = CRC error as ACK low nibbles; not decoded here, because 0x3 and 0x7 are also common LL bytes of the next frame (not seen as ACK on our bus)"
# The frame carries only the DESTINATION. The sender is derived from the destination class and is therefore
# never better than "assumed". Exact node entries win over class entries ("1x" = every 0x1_ destination).
# DS byte = destination node (high nibble) + subsystem (low nibble). There is NO source field on the wire
# (hn/bsh-home-appliances; bruestel/openHAB agree). Verified against our own recordings: only high nibbles 1 and 2
# occur; the low nibble tracks the command group, not a sender. The sender below is therefore always derived.
node_addresses:
  "0": {name: "network management / broadcast", status: assumed, evidence: "hn/bsh-home-appliances (washing machine); not seen on our dishwasher"}
  "1": {name: "washing control unit (power module)", status: assumed, evidence: "hn table; commands from the panel arrive here (0x17)"}
  "2": {name: "user control panel", status: assumed, evidence: "hn table; state reports (0x24-0x27) go here"}
  "6": {name: "TimeLight", status: assumed, evidence: "hn DISHWASHER.md; not seen yet"}
  "a": {name: "internet communication end point", status: assumed, evidence: "hn table; not seen yet"}
  "b": {name: "WiFi module", status: assumed, evidence: "hn table; not seen yet"}
subsystems:
  "0": {name: "common / memory dump", status: assumed, evidence: "hn: S=0 is the same on all devices"}
  "4": {name: "set parameters", status: assumed, evidence: "hn (washing machine)"}
  "5": {name: "start/stop processes", status: assumed, evidence: "hn (washing machine)"}
  "6": {name: "user info I", status: assumed, evidence: "hn (washing machine)"}
  "7": {name: "user info II / other", status: assumed, evidence: "hn lists 0xa for user info II; 0x7 differs on the dishwasher (0x17/0x1xxx commands, 0x27/0x2007)"}
  "f": {name: "network management / broadcast", status: assumed, evidence: "hn"}
nodes:
  "1x":
    receiver: "power module"
    sender: "control panel"
    status: assumed
    evidence: "commands (program, options, start) go to 0x17 and appear only when the panel is operated"
  "2x":
    receiver: "control panel (status broadcast)"
    sender: "power module"
    status: assumed
    evidence: "state reports (remaining time, door, operating state) appear on their own while the module runs"
acks:
  "1": {node: "power module", status: assumed, evidence: "ACK = 0x0A | destination node << 4 (hn); in our data 1A follows 0x1x frames, 2A follows 0x2x frames"}
  "2": {node: "control panel", status: assumed, evidence: "ACK high nibble = addressed node (hn): 2A acknowledges 0x2x frames, i.e. the panel"}
# How telegrams are grouped into runs (program cycles). Detection is a heuristic and always marked as such.
runs:
  start:
    key: "17/1013"          # start command sent by the panel
    byte: 0
    value: 1
    status: assumed
    evidence: "17/1013 = 01 comes together with 17/1012 at program start; the module then reports 27/2007 = 01"
  end:
    marker:                 # the run ends with the first intact frame that matches; the gap below is only the fallback
      key: "27/2007"
      byte: 0
      value: 3
      status: confirmed
      evidence: "27/2007 = 03 (finished) is sent exactly once at the end of each of the six recorded runs (1 h 65 C, Auto 45-65 C, Eco 50 C) and of one earlier partial recording; the module then sends 25/2012 = 00 about 120 s later"
    gap_minutes: 20         # fallback: no telegram for this long ends the run, or the next start begins a new one
    status: assumed
    evidence: "fallback when the end marker frame was lost (CRC error): the end is the last telegram before a silent gap"
  context_seconds: 300      # telegrams shown before the start (program selection, power on)
  program_key: "17/1011"    # program selection used to name the run
  remaining_key: "25/2008"  # remaining time, byte 0 in minutes
enums:
  program:
    "0x1c": "Chef 70 C"
    "0x0d": "Auto 45-65 C"
    "0x0e": "Eco 50 C"
    "0x0f": "Glass 40 C"
    "0x15": "1 h 65 C"
    "0x12": "Pre-rinse"
    "0x21": "EasyClean"
  operating_state:
    "0x01": "running"
    "0x02": "on / idle"
    "0x03": "finished (cycle ended)"
    "0x06": "seen during or after a run, meaning unclear"
commands:
  - key: "24/2006"
    name: sensors
    title: "Door, rinse aid, salt (sent while the module is awake: power-on, each door change, end of a run)"
    status: confirmed
    evidence: "Neff S413K60S0E: byte 0 bit 3 = door closed. The frame follows the door contact live while the module is awake: after power-on a door close was reported 3 s later (0x0a) and a door open 8 s later (0x02), each within about 3 s of the action. It is also sent at power-on and at the end of a run. While the machine is switched off (about two minutes after 27/2007 = 03 the bus goes silent) opening and closing the door produced no telegram at all. Tested: opening and closing the door while the machine is in standby sends nothing, so the door does not wake the module and its state is unknown until the next power-on. Bit 1 = rinse aid needs refilling, bit 0 = salt needs refilling (flag set = refill): seen on one machine: bit 1 was set in every recording and bit 0 never (0x0a with the door closed, 0x02 with the door open), while the machine's display showed rinse aid low and salt sufficient. This matches the firmware example (after jowi24, Siemens SX66T096EU) and rules out the reverse mapping in upstream hn DISHWASHER.md (bit 0 = rinse aid LED, bit 1 = salt LED). Still one state each, so both stay assumed: the flags have never been seen toggling; a recording after a short rinse aid fill (bit 1 should clear) or a salt-low state would confirm them"
    fields:
      - {byte: 0, bit: 3, name: door_closed, label: Door closed, status: confirmed}
      - {byte: 0, bit: 1, name: rinse_aid_flag, label: Rinse aid flag, status: assumed}
      - {byte: 0, bit: 0, name: salt_flag, label: Salt flag, status: assumed}
  - key: "25/2008"
    name: remaining_time
    title: Remaining time
    status: confirmed
    evidence: "byte 0 counts down in minutes (160 at start of a Chef 70 C run, 159 a minute later). The estimate is adaptive: an Auto 45-65 C run started with 165 min, the value dropped by 30 min (118 to 88) at the phase pulse 25/2005 = 12 at +47 min and by 15 min (79 to 64) at the next one at +57 min, and the run ended after 120 min; the first frame after power-on shows the previously used program (210 min, bytes 1-2 3030) before the selected program (165 min, bytes 1-2 404c) follows. Bytes 3 and 4 are hours and minutes of the same value: byte 0 = byte 3 * 60 + byte 4 in all 144 sampled frames of three recordings (for example 81 .. 02 09 = 129 min = 2:09), and bytes 6 and 7 repeat bytes 3 and 4. Bytes 1 and 2 are not understood (0x5058 at 129 min, 0x3030 at 210 min, 0x4430 at 60 min); the first frame after power-on can still show the previously used program's time"
    fields:
      - {byte: 0, kind: u8, name: remaining_min, label: Remaining time, unit: min, status: confirmed}
      - {byte: 3, kind: u8, name: remaining_h, label: Remaining hours, unit: h, status: confirmed}
      - {byte: 4, kind: u8, name: remaining_m, label: Remaining minutes part, unit: min, status: confirmed}
  - key: "25/2000"
    name: progress
    title: Program progress
    status: confirmed
    evidence: "rises in uneven steps to 0x64 (100) when the remaining time hits 0; Eco 50 C showed 0x5F (95) with 11 of 210 min left. In an Auto 45-65 C run it jumped from 28 to 47 percent within a second when the remaining time was re-estimated (118 to 88 min), so it is derived from the current estimate and not from elapsed time alone"
    fields:
      - {byte: 0, kind: u8, name: progress_percent, label: Progress, unit: "%", status: confirmed}
  - key: "25/2012"
    name: after_end
    title: Run flag (01 at the start, 00 two minutes after the end)
    status: unknown
    evidence: "value 01 about 1 s after power-on at the start of a run (1 h 65 C), value 00 as one frame exactly 120 s after 27/2007 = 03 at the end of each run; probably marks the module leaving and entering standby; also seen as 00 less than a second after the door was opened while the machine was idle after power-on"
  - key: "25/2013"
    name: end_marker
    title: Marker ff00 (at the start and at the end of a run)
    status: unknown
    evidence: "value ff00 sent together with 27/2007 = 03 and 25/1013 = 00 at the end of every run (25/2005 = 0x28 in the same burst), but also about 1 s after power-on at the start of a run; so it is not an end marker on its own: use 27/2007 = 03"
  - key: "17/1010"
    name: program_select_early
    title: Program selection (panel, early)
    status: confirmed
    evidence: "byte 0 equals the program shown on the panel"
    fields:
      - {byte: 0, kind: enum, enum: program, name: program, label: Program, status: confirmed}
  - key: "17/1011"
    name: program_select
    title: Program selection (panel)
    status: confirmed
    evidence: "same value as 17/1010; often lost to CRC errors on the Neff bus"
    fields:
      - {byte: 0, kind: enum, enum: program, name: program, label: Program, status: confirmed}
  - key: "25/2010"
    name: program_echo
    title: Program echo from the module
    status: confirmed
    evidence: "byte 0 is a program id in the module; at power-on it is the program used last (echo 0x0e, then the panel set 0x15 with 17/1010 + 17/1011 in a 1 h 65 C run), so it is not the current selection once the panel has changed it"
    fields:
      - {byte: 0, kind: enum, enum: program, name: program, label: Program, status: confirmed}
  - key: "17/1000"
    name: options
    title: Options
    status: confirmed
    evidence: "byte 1 bits follow the option buttons"
    fields:
      - {byte: 1, bit: 7, name: vario_speed_plus, label: VarioSpeedPlus, status: confirmed}
      - {byte: 1, bit: 6, name: intensive_zone, label: IntensiveZone, status: confirmed}
      - {byte: 1, bit: 1, name: extra_drying, label: Extra drying, status: confirmed}
  - key: "27/2007"
    name: operating_state
    title: Operating state
    status: confirmed
    evidence: "02 after power-on, 01 right after start; 03 together with remaining time 0 exactly once at the end of every recorded run (six runs plus one earlier partial recording); 06 was seen in earlier runs, unclear, and is not in the current database"
    fields:
      - {byte: 0, kind: enum, enum: operating_state, name: state, label: State, status: confirmed}
  - key: "17/1007"
    name: power
    title: Power on (panel)
    status: assumed
    evidence: "value 01 appears when the machine is switched on"
    fields:
      - {byte: 0, kind: u8, name: power, label: Power, status: assumed}
  - key: "17/1012"
    name: delay_start
    title: Delayed start (7 data bytes)
    status: unknown
    evidence: "all zero when started without delay; changing the delay on the panel alone sends nothing; layout with a non-zero delay not yet recorded"
    fields: []
  - key: "17/1013"
    name: start
    title: Start command
    status: assumed
    evidence: "data 01 is sent together with 17/1012 at program start; the module then reports 27/2007 = 01"
    fields:
      - {byte: 0, kind: u8, name: start, label: Start, status: assumed}
  - key: "25/2005"
    name: phase
    title: Program phase
    status: unknown
    evidence: "changes during a run; mapping of values to phases not verified. Sequence in a 3650 s run (1 h 65 C), seconds after start: 20, 21 (start), 22 (+190), 12 for 2 s (+1825) then 22, 14 for 1 s (+2249) then 24, 28 (+2964), 18 for 1 s (+3065) then 28. Auto 45-65 C run (7216 s), minutes after start: 21 (start), 22 (+19), then 12 for 5 s followed by 22 at +47, +57, +58 and +69, 24 (+70), 28 (+84), 18 for 5 s followed by 28 twice at +86. Hypothesis: low nibble 1/2/4/8 = step in the order 1, 2, 4, 8 (in both runs the last step 8 lasts the final 19 to 35 percent of the run, probably drying), bit 0x10 = short pulse. In the Auto run each pulse in step 2 coincides with a drop of the remaining time (see 25/2008), so the pulses mark moments where the module re-estimates the run time (probably sensor measurements); not verified"
    fields:
      - {byte: 0, kind: u8, name: phase, label: Phase, status: unknown}
  - key: "25/2004"
    name: flags
    title: Flags
    status: unknown
    evidence: "bit field, meaning unknown. Values 800000 (7 times, a few seconds after start), 200000 (17 times: a few seconds after start and together with 27/2007 = 03 at the end), 000000 (12 times); so bit 7 of byte 0 looks like a start flag and bit 5 like a running/finished flag"
    fields: []
  - key: "26/2002"
    name: status_26
    title: Status after start
    status: unknown
    evidence: "00000000 observed after start"
    fields: []
  - key: "25/2011"
    name: program_list
    title: Program list (module announces supported programs)
    status: assumed
    evidence: "starts with a5 followed by the program ids 1c 0d 0e 0f 15 12 ... seen at power-on on a Neff S413K60S0E"
    fields: []
  - key: "25/2009"
    name: heartbeat
    title: Periodic frame, always 00
    status: unknown
    evidence: "760 frames (about a fifth of all traffic), always the single byte 00 from the first to the last recording; probably a cyclic heartbeat of the module"
    fields: []
  - key: "25/2015"
    name: start_parameter
    title: Parameter sent at power-on / start (0fff or 0e40)
    status: unknown
    evidence: "0fff 11 times, 0e40 twice, both right before a 1 h 65 C run; so it may depend on the program last used or selected"
    fields: []
  - key: "25/1012"
    name: cmd_1012
    title: Seven data bytes at power-on / start
    status: unknown
    evidence: "00 00 00 00 03 1e 00 seven times, once 00 00 00 00 02 2d 00 at the start of an Auto 45-65 C run; the last three bytes could be hours and minutes (3:30 and 2:45) but do not match the program, meaning unknown"
    fields: []
  - key: "22/7ff1"
    name: node22_7ff1
    title: Node 0x22 message 7ff1
    status: unknown
    evidence: "single byte (10), seen right after power-on; meaning unknown"
    fields: []
  - key: "25/1017"
    name: cmd_1017
    title: Command 1017 from node 0x25
    status: unknown
    evidence: "seen twice around power-on; meaning unknown"
    fields: []
  - key: "25/1020"
    name: cmd_1020
    title: Command 1020 from node 0x25
    status: unknown
    evidence: "seen once around power-on; meaning unknown"
    fields: []
