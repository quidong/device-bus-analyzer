# Protocol findings for the BSH D-Bus. Source of truth for the decoder AND the findings page.
# status: confirmed = verified against several recorded runs; assumed = plausible, not yet verified;
#         unknown   = seen on the bus, meaning not understood.
# Device-specific notes name the model they were observed on. Nothing in here may contain private data.
protocol: bshdbus
title: BSH D-Bus (Bosch / Siemens / Neff)
physical: "9600 baud, 8N1, half duplex, idle gap 15 ms ends a burst"
frame: "LL DS CC CC data... CRC16-XMODEM(LL..data); total length LL+4; ACK byte with low nibble 0xA. Upstream (hn) also lists 0x3 = frame exceeds the receive buffer and 0x7 = CRC error as ACK low nibbles; not decoded here, because 0x3 and 0x7 are also common LL bytes of the next frame (not seen as ACK on our bus)"
# The frame carries only the DESTINATION. The sender is derived from the destination class and is therefore
# never better than "assumed". Exact node entries win over class entries ("1x" = every 0x1_ destination).
# DS byte = destination node (high nibble) + subsystem (low nibble). There is NO source field on the wire
# (hn/bsh-home-appliances; bruestel/openHAB agree). Verified against our own recordings: only high nibbles 1 and 2
# occur; the low nibble tracks the command group, not a sender. The sender below is therefore always derived.
node_addresses:
  "0": {name: "network management / broadcast", status: assumed, evidence: "hn/bsh-home-appliances (washing machine); not seen on our dishwasher"}
  "1": {name: "washing control unit (power module)", status: assumed, evidence: "hn table; commands from the panel arrive here (0x17)"}
  "2": {name: "user control panel", status: assumed, evidence: "hn table; state reports (0x24-0x27) go here"}
  "6": {name: "TimeLight", status: assumed, evidence: "hn DISHWASHER.md; not seen yet"}
  "a": {name: "internet communication end point", status: assumed, evidence: "hn table; not seen yet"}
  "b": {name: "WiFi module", status: assumed, evidence: "hn table; not seen yet"}
subsystems:
  "0": {name: "common / memory dump", status: assumed, evidence: "hn: S=0 is the same on all devices"}
  "4": {name: "set parameters", status: assumed, evidence: "hn (washing machine)"}
  "5": {name: "start/stop processes", status: assumed, evidence: "hn (washing machine)"}
  "6": {name: "user info I", status: assumed, evidence: "hn (washing machine)"}
  "7": {name: "user info II / other", status: assumed, evidence: "hn lists 0xa for user info II; 0x7 differs on the dishwasher (0x17/0x1xxx commands, 0x27/0x2007)"}
  "f": {name: "network management / broadcast", status: assumed, evidence: "hn"}
nodes:
  "1x":
    receiver: "power module"
    sender: "control panel"
    status: assumed
    evidence: "commands (program, options, start) go to 0x17 and appear only when the panel is operated"
  "2x":
    receiver: "control panel (status broadcast)"
    sender: "power module"
    status: assumed
    evidence: "state reports (remaining time, door, operating state) appear on their own while the module runs"
acks:
  "1": {node: "power module", status: assumed, evidence: "ACK = 0x0A | destination node << 4 (hn); in our data 1A follows 0x1x frames (35 of 35), 2A follows 0x2x frames (1834 of 1838 acknowledged; the other 4 were 25/2008 with the Auto estimate 2:45, acknowledged with 0A)"}
  "2": {node: "control panel", status: assumed, evidence: "ACK high nibble = addressed node (hn): 2A acknowledges 0x2x frames, i.e. the panel"}
# How telegrams are grouped into runs (program cycles). Detection is a heuristic and always marked as such.
runs:
  start:
    key: "17/1013"          # start command sent by the panel
    byte: 0
    value: 1
    status: assumed
    evidence: "17/1013 = 01 comes together with 17/1012 at program start; the module then reports 27/2007 = 01"
    wait:                   # delayed start: the run begins when the state goes from waiting to running, not at the start command
      key: "27/2007"
      byte: 0
      wait_values: [4]
      run_values: [1]
      status: confirmed
      evidence: "with a delay set the module reports 27/2007 = 04 after the start command and 01 when the delay is over (one full run: 59 min 52 s for a 1 h delay); the programme time counts from 01"
  end:
    marker:                 # the run ends with the first intact frame that matches; the gap below is only the fallback
      key: "27/2007"
      byte: 0
      value: 3
      status: confirmed
      evidence: "27/2007 = 03 (finished) is sent exactly once at the end of each of the seven recorded runs (1 h 65 C, Auto 45-65 C, Eco 50 C) and of one earlier partial recording; the module then sends 25/2012 = 00 about 120 s later"
    cancel:                 # delayed start cancelled again: state 04 (waiting) followed by 02 (idle) ends the run
      key: "27/2007"
      byte: 0
      after_values: [4]
      values: [2]
      status: assumed
      evidence: "a delayed start (state 04) was cancelled with a long press of Reset in 2 of 2 recordings: the module then reported 27/2007 = 02 again, the remaining time fell back to the program time and no program ran; so 04 followed by 02 is read as a cancelled start, not as a finished run"
    gap_minutes: 20         # fallback: no telegram for this long ends the run, or the next start begins a new one
    status: assumed
    evidence: "fallback when the end marker frame was lost (CRC error): the end is the last telegram before a silent gap"
  context_seconds: 300      # telegrams shown before the start (program selection, power on)
  program_key: "17/1011"    # program selection used to name the run
  program_fallback_key: "25/2010"   # no selection before the start (default program): use the echo from power-on
  program_fallback_seconds: 43200
  remaining_key: "25/2008"  # remaining time, byte 0 in minutes
enums:
  program:
    "0x1c": "Chef 70 C"
    "0x0d": "Auto 45-65 C"
    "0x0e": "Eco 50 C"
    "0x0f": "Glass 40 C"
    "0x15": "1 h 65 C"
    "0x12": "Pre-rinse"
    "0x21": "EasyClean"
  operating_state:
    "0x01": "running"
    "0x02": "on / idle"
    "0x03": "finished (cycle ended)"
    "0x04": "delayed start set, waiting"
    "0x06": "seen during or after a run, meaning unclear"
commands:
  - key: "24/2006"
    name: sensors
    title: "Door, rinse aid, salt (sent while the module is awake: power-on, each door change, end of a run)"
    status: confirmed
    evidence: "Neff S413K60S0E: byte 0 bit 3 = door closed. The frame follows the door contact live while the module is awake: after power-on a door close was reported 3 s later (0x0a) and a door open 8 s later (0x02), each within about 3 s of the action. It is also sent at power-on and at the end of a run. While the machine is switched off (about two minutes after 27/2007 = 03 the bus goes silent) opening and closing the door produced no telegram at all. Tested: opening and closing the door while the machine is in standby sends nothing, so the door does not wake the module and its state is unknown until the next power-on. Bit 1 = rinse aid needs refilling, bit 0 = salt needs refilling (flag set = refill): seen on one machine: bit 1 was set in every recording and bit 0 never (0x0a with the door closed, 0x02 with the door open), while the machine's display showed rinse aid low and salt sufficient. This matches the firmware example (after jowi24, Siemens SX66T096EU) and rules out the reverse mapping in upstream hn DISHWASHER.md (bit 0 = rinse aid LED, bit 1 = salt LED). Still one state each, so both stay assumed: the flags have never been seen toggling; a recording after a short rinse aid fill (bit 1 should clear) or a salt-low state would confirm them"
    fields:
      - {byte: 0, bit: 3, name: door_closed, label: Door closed, status: confirmed}
      - {byte: 0, bit: 1, name: rinse_aid_flag, label: Rinse aid flag, status: assumed}
      - {byte: 0, bit: 0, name: salt_flag, label: Salt flag, status: assumed}
  - key: "25/2008"
    name: remaining_time
    title: Remaining time
    status: confirmed
    evidence: "byte 0 counts down in minutes (160 at start of a Chef 70 C run, 159 a minute later). The estimate is adaptive: an Auto 45-65 C run started with 165 min, the value dropped by 30 min (118 to 88) at the phase pulse 25/2005 = 12 at +47 min and by 15 min (79 to 64) at the next one at +57 min, and the run ended after 120 min; the frames right after power-on alternate between the time of the default selection (210 min for Eco, bytes 1-2 3030) and the selected program (165 min for Auto, bytes 1-2 404c) until the selection is final. In a second Auto run the first re-estimate also landed on 88 min (from 124) and the second on 62 (from 80); the run took 110 min instead of 120, so the module picks the new estimate in steps, probably from sensor measurements. Auto 45-65 C runs lasted 110 to 120 min against the 165 min announced. Bytes 3 and 4 are hours and minutes of the same value: byte 0 = byte 3 * 60 + byte 4 in all 144 sampled frames of three recordings (for example 81 .. 02 09 = 129 min = 2:09), and bytes 6 and 7 repeat bytes 3 and 4. Bytes 1 and 2 are not understood (0x5058 at 129 min, 0x3030 at 210 min, 0x4430 at 60 min); the first frame after power-on can still show the previously used program's time Eco 50 C run from the default program (no selection, started 43 min after power-on): 210 min announced, byte 0 fell by one per minute from 210 to 20 over 188 min with no large re-estimate; the minute tick only shifted by seconds at the phase pulses (28 s early at +113 min, 4 s late at +131 min, one minute skipped at +149 min), and the second hour byte pair stayed 3030. So the large jumps of the Auto runs come from the program, not from the counter itself The Eco 50 C run ended after 207.3 min, not 210: the counter skipped one minute at +149 min and the last step went from 2 straight to 0 within 45 s, where the end marker 27/2007 = 03 came; so Eco also ends a little early, by under three minutes 1 h 65 C run (selected after power-on): 60 min announced (bytes 1-2 4430, bytes 3-4 01 00), the run took 59.0 min. The remaining time ran one per minute with three corrections at the phase pulses: plus one minute at pulse 12 (+30.6 min), minus one minute at pulse 18 (+51.2 min, 11 to 9 within 31 s) and minus one minute at the end (2 to 0 within 48 s). The Eco run also lost a minute at pulse 18 and one at the end, so the last pulse and the end each shorten the displayed time by a minute. With a delayed start (6 h, EasyClean) bytes 3 and 4 showed 7:30 h while byte 0 stayed at 90 min, so byte 0 is the program time only and the hour/minute bytes include the delay: the rule byte 0 = byte 3 * 60 + byte 4 holds only without a delayed start. After the delay was cancelled all of them were back at 90 min / 1:30 h. Full delay (Auto 45-65 C, 1 h): while waiting, byte 0 stayed 165 (program time), bytes 3 and 4 showed the total 3:45 h and counted down with the delay, bytes 6 and 7 stayed at the program time 2:45; at the end of the delay all three were 2:45 again and the programme ran. Option changes are applied live while waiting: VarioSpeedPlus switched on 38 min into the wait changed byte 0 from 165 to 90 and bytes 1-2 from 404c to 4854, the total from 2:22 to 1:52 h, and back when switched off. Bytes 1-2 so far: 3030 Eco, 404c Auto, 4430 1 h 65 C, 4830 1 h 65 C with extra drying, 4854 Auto with VarioSpeedPlus; the rule is not understood"
    fields:
      - {byte: 0, kind: u8, name: remaining_min, label: Remaining time, unit: min, status: confirmed}
      - {byte: 3, kind: u8, name: remaining_h, label: Remaining hours, unit: h, status: confirmed}
      - {byte: 4, kind: u8, name: remaining_m, label: Remaining minutes part, unit: min, status: confirmed}
  - key: "25/2000"
    name: progress
    title: Program progress
    status: confirmed
    evidence: "rises in uneven steps to 0x64 (100) when the remaining time hits 0; Eco 50 C showed 0x5F (95) with 11 of 210 min left. In an Auto 45-65 C run it jumped from 28 to 47 percent within a second when the remaining time was re-estimated (118 to 88 min), so it is derived from the current estimate and not from elapsed time alone In the Eco 50 C run it rose by one percent about every 2.1 minutes (210 min / 100), reached 0x5A (90) after 188 min, so with an unchanged estimate it simply follows elapsed time / announced time The value is calculated from the remaining time: percent = 100 x (1 - remaining / announced time), rounded. In a 1 h 65 C run (60 min announced) all 60 pairs of progress and remaining time agreed within 0.34 percent; it also fits the Auto run (28 percent at 118 of 165 min left, 47 percent at 88) and the Eco run (90 percent with 20 of 210 min left). So the progress jumps whenever the module changes the remaining time"
    fields:
      - {byte: 0, kind: u8, name: progress_percent, label: Progress, unit: "%", status: confirmed}
  - key: "25/2012"
    name: after_end
    title: Run flag (01 at the start, 00 two minutes after the end)
    status: unknown
    evidence: "value 01 about 1 s after power-on at the start of a run (1 h 65 C), value 00 as one frame exactly 120 s after 27/2007 = 03 at the end of each run; probably marks the module leaving and entering standby; it also came as 00 only 12 s after a cancelled delayed start (long press of Reset), so it is not tied to the 120 s after the end marker (second time: 4 s after the cancel, 98 s after the start); switching the machine off by hand a few minutes later produced no telegram at all, so a manual power-off is not visible on the bus; also seen as 00 less than a second after the door was opened while the machine was idle after power-on In the Eco 50 C run the 00 followed the end marker after 119.7 s, as in the Auto runs"
  - key: "25/2013"
    name: end_marker
    title: Marker ff00 (at the start and at the end of a run)
    status: unknown
    evidence: "value ff00 sent together with 27/2007 = 03 and 25/1013 = 00 at the end of every run (25/2005 = 0x28 in the same burst), but also about 1 s after power-on at the start of a run; so it is not an end marker on its own: use 27/2007 = 03 Also sent with the end marker of the Eco 50 C run, in the same instant as 27/2007 = 03, 25/2008 = 0, 25/2000 = 0x64, 25/2004 = 200000, 24/2006 and 25/1013 = 00"
  - key: "17/1010"
    name: program_select_early
    title: Program selection (panel, early)
    status: confirmed
    evidence: "byte 0 equals the program shown on the panel"
    fields:
      - {byte: 0, kind: enum, enum: program, name: program, label: Program, status: confirmed}
  - key: "17/1011"
    name: program_select
    title: Program selection (panel)
    status: confirmed
    evidence: "same value as 17/1010; often lost to CRC errors on the Neff bus At power-on the panel first sends the program the machine holds (0e Eco, together with 17/1010 = 0e) and about 5 s later the chosen one (15 for 1 h 65 C), so the first selection after switching on is not necessarily the one that runs"
    fields:
      - {byte: 0, kind: enum, enum: program, name: program, label: Program, status: confirmed}
  - key: "25/2010"
    name: program_echo
    title: Program echo from the module
    status: assumed
    evidence: "byte 0 is a program id in the module; at power-on it is mostly 0x0e (Eco): 14 of 15 power-ons, also when the previous run used Auto, and once 0x0d (Auto after an Auto run), so 'program used last' does not explain it reliably; the panel then sets the selection with 17/1010 + 17/1011 (0x15 in a 1 h 65 C run, 0x0d for Auto), so the echo is not the current selection once the panel has changed it The Eco 50 C run that started without a selection ran the program of this echo (0x0e), so the echo is the program the module holds at power-on; selections made later with 17/1010 + 17/1011 do not change it"
    fields:
      - {byte: 0, kind: enum, enum: program, name: program, label: Program, status: confirmed}
  - key: "17/1000"
    name: options
    title: Options
    status: confirmed
    evidence: "byte 1 bits follow the option buttons. Extra drying switched on with 1 h 65 C selected (byte 1 = 02): the module raised the remaining time from 60 to 70 min at once (25/2008 bytes 1-2 4430 became 4830, 25/1012 nominal time 1:10), so the option adds 10 min for this program; it stayed set after a cancelled delayed start. VarioSpeedPlus (byte 1 = 80) shortens Auto 45-65 C from 165 to 90 min on the announced time; it was also applied during a delay and removed again by pressing it twice"
    fields:
      - {byte: 1, bit: 7, name: vario_speed_plus, label: VarioSpeedPlus, status: confirmed}
      - {byte: 1, bit: 6, name: intensive_zone, label: IntensiveZone, status: confirmed}
      - {byte: 1, bit: 1, name: extra_drying, label: Extra drying, status: confirmed}
  - key: "27/2007"
    name: operating_state
    title: Operating state
    status: confirmed
    evidence: "02 after power-on, 01 right after start; 03 together with remaining time 0 exactly once at the end of every recorded run (six runs plus one earlier partial recording); 06 was seen in earlier runs, unclear, and is not in the current database. 04 was seen once: right after the start command with a delayed start set (17/1012 = 0c06...), together with the remaining time 7:30 h (6 h delay plus 1:30 h of EasyClean); after the delay was cancelled with a long press of Reset the module reported 02 again. Third recording, the first with a full delay (Auto 45-65 C, 1 h): 04 right after the start command, the run began when the state went to 01 at the end of the delay (59 min 52 s after the start command, no new start command from the panel), and 03 at the end of the run after 118.8 min. So 04 = delayed start waiting is confirmed by 3 of 3 recordings (two cancelled, one run to the end)"
    fields:
      - {byte: 0, kind: enum, enum: operating_state, name: state, label: State, status: confirmed}
  - key: "17/1001"
    name: cmd_1001
    title: "Panel message 1001 (single byte, always 00)"
    status: unknown
    evidence: "11 frames, always the single byte 00, seen at power-on; meaning unknown"
    fields: []
  - key: "17/1007"
    name: power
    title: Power on (panel)
    status: confirmed
    evidence: "value 01 appears when the machine is switched on: in 5 of 5 power-ons of the raw recordings, each together with the module's power-on messages 25/2010 and 22/7ff1 and never at any other time"
    fields:
      - {byte: 0, kind: u8, name: power, label: Power, status: confirmed}
  - key: "17/1012"
    name: delay_start
    title: Delayed start (7 data bytes)
    status: confirmed
    evidence: "all zero when started without delay; changing the delay on the panel alone sends nothing. One recording of a delayed start (EasyClean, 6 h delay): the panel sent 0c 06 00 00 00 00 00 just before the start command 17/1013 = 01, so byte 1 = delay in hours (06) is the assumption; byte 0 = 0c is not understood. The module echoed the same bytes in 25/1012 = 0c 06 00 00 07 1e 00 with bytes 4 and 5 = 7:30 h (delay plus program time), so the delay is not in bytes 4 and 5 of the panel frame but in byte 1. Cancelling the delay (long press of Reset, 6 s after the start) sent 00 00 00 01 00 00 00 (byte 3 = 01 assumed to be the reset flag); the module then reported 27/2007 = 02, the remaining time 1:30 h again and 25/1012 = 00 00 00 00 01 1e 00. The selected program stayed, no 17/1010 or 17/1011 was sent. Second recording (1 h 65 C with extra drying, 3 h delay): 06 03 00 00 00 00 00, so byte 1 = delay in hours holds (03), and byte 0 was 2 x byte 1 both times (0c with 6 h, 06 with 3 h), probably the delay in units of 30 min. Cancelling again sent 00 00 00 01 00 00 00, 98 s after the start, with the same reaction (27/2007 = 02, remaining time back to the program time of 1:10 h, option and program kept). Third recording (Auto 45-65 C, 1 h delay): 02 01 00 00 00 00 00, so byte 1 = delay in hours holds in 3 of 3 recordings (6 h, 3 h, 1 h) and byte 0 = 2 x byte 1 each time. The module counted its own frame down in minutes (see 25/1012) and started the run when the delay was over, without another command from the panel. Byte 1 is confirmed; that byte 0 counts half-hours is an assumption"
    fields:
      - {byte: 0, kind: u8, name: delay_half_hours, label: Delay in half-hours, status: assumed}
      - {byte: 1, kind: u8, name: delay_h, label: Delay, unit: h, status: confirmed}
  - key: "17/1013"
    name: start
    title: Start command
    status: confirmed
    evidence: "data 01 is sent together with 17/1012 at program start; the module then reports 27/2007 = 01. Seen at 4 of 4 run starts of the raw recordings (Auto, Auto, Auto, Eco from the default program) and at no other time"
    fields:
      - {byte: 0, kind: u8, name: start, label: Start, status: confirmed}
  - key: "25/2005"
    name: phase
    title: Program phase
    status: assumed
    evidence: "changes during a run; mapping of values to phases not verified. The order of the steps is confirmed: 21 (start), 22, 24, 28 in 4 of 4 raw runs (1 h 65 C, two Auto, Eco), so the low nibble counts steps 1, 2, 4, 8 and bit 0x10 marks a pulse; what each step does is a guess. Sequence in a 3650 s run (1 h 65 C), seconds after start: 20, 21 (start), 22 (+190), 12 for 2 s (+1825) then 22, 14 for 1 s (+2249) then 24, 28 (+2964), 18 for 1 s (+3065) then 28. Auto 45-65 C run (7216 s), minutes after start: 21 (start), 22 (+19), then 12 for 5 s followed by 22 at +47, +57, +58 and +69, 24 (+70), 28 (+84), 18 for 5 s followed by 28 twice at +86. In a second Auto run (110 min) the same sequence came at +19, +42/+51/+61 (pulses), 4 at +61, 8 at +75, so step 2 always starts at +19 min and step 8 lasted 36 min in both Auto runs (35.5 and 36) while the middle steps vary with the run length. Hypothesis: low nibble 1/2/4/8 = step in the order 1, 2, 4, 8 (the last step 8 lasts the final 19 to 35 percent of the run, probably drying), bit 0x10 = short pulse. In the Auto run each pulse in step 2 coincides with a drop of the remaining time (see 25/2008), so the pulses mark moments where the module re-estimates the run time (probably sensor measurements); not verified Eco 50 C run (210 min, default program): 20 at power-on, 21 at the start, 22 at +15.5 min, 12 for 3 s at +113 min, 24 at +129 min, 14 for 1 s at +131 min, 28 at +147.5 min and 18 for 1 s (twice) at +149 min, so the last step 8 began 62 min before the announced end, 30 percent of the run (Auto runs 19 to 35 percent), which fits drying. Each pulse comes within seconds of a small shift of the remaining-time tick (see 25/2008): the pulse marks a re-evaluation of the remaining time. The first step 2 came at +15.5 min here, at +19 min in the Auto runs 1 h 65 C run: 21 at the start, 22 at +3.5 min, 12 for 2 s at +30.6 min, 24 together with a 14 pulse at +37.65 min, 28 at +49.5 min and 18 for a moment at +51.2 min, the same times within a few seconds as the 1 h 65 C run recorded earlier (+3.2, +30.4, +37.5, +49.4, +51.1 min), so the step times are fixed per program and repeat from run to run. The last step lasted 17 percent of this 59 min run (30 percent of the Eco run). Pulse 12 raised the remaining time by a minute here, pulse 18 lowered it, so a pulse is a re-evaluation of the remaining time"
    fields:
      - {byte: 0, kind: u8, name: phase, label: Phase, status: unknown}
  - key: "25/2004"
    name: flags
    title: Flags
    status: unknown
    evidence: "bit field, meaning unknown. Values 800000 (7 times, a few seconds after start), 200000 (17 times: a few seconds after start and together with 27/2007 = 03 at the end), 000000 (12 times); so bit 7 of byte 0 looks like a start flag and bit 5 like a running/finished flag"
    fields: []
  - key: "26/2002"
    name: status_26
    title: Status after start
    status: unknown
    evidence: "00000000 observed after start"
    fields: []
  - key: "25/2011"
    name: program_list
    title: Program list (module announces supported programs)
    status: assumed
    evidence: "starts with a5 followed by the program ids 1c 0d 0e 0f 15 12 ... seen at power-on on a Neff S413K60S0E, 5 of 5 times with the same bytes. The ids 1c, 0d, 0e and 15 are the programs Chef 70 C, Auto 45-65 C, Eco 50 C and 1 h 65 C seen in selections and echoes; 0f and 12 have not been seen anywhere else"
    fields: []
  - key: "25/2009"
    name: heartbeat
    title: Frame 00, irregular (not a fixed-interval heartbeat)
    status: unknown
    evidence: "504 frames in the raw recordings (a large share of all traffic), always the single byte 00. It is not periodic: in the 207 min Eco run 115 frames came with gaps from 0.1 s to a minute (0.1 s 11 times, 2.0 s 7 times, 10.0 s 7 times, 15 s 5 times, many others), so the earlier idea of a cyclic heartbeat does not hold; meaning unknown"
    fields: []
  - key: "25/2015"
    name: start_parameter
    title: Parameter sent at power-on / start (0fff or 0e40)
    status: unknown
    evidence: "0fff 11 times, 0e40 twice, both right before a 1 h 65 C run; so it may depend on the program last used or selected. It follows the program selected at power-on: Eco 0fff, Glass 40 C 0fcb, Chef 70 C 0fff, EasyClean 0800 and, again, 1 h 65 C 0e40 (third time), seen in the 25/2008 burst of each selection; meaning still unknown"
    fields: []
  - key: "25/1012"
    name: cmd_1012
    title: Nominal run time of the stored program (seven data bytes at power-on)
    status: confirmed
    evidence: "00 00 00 00 03 1e 00 in 15 power-ons, once 00 00 00 00 02 2d 00. Bytes 4 and 5 read as hours and minutes give 3:30 = 210 min (Eco) and 2:45 = 165 min (Auto), the announced times of the programs that 25/2010 names in the same moment (0e and once 0d, 5 ms apart). So it is the nominal run time of the program the module holds at power-on; bytes 0-3 and 6 are always 0 Confirmed by the Eco 50 C run that started without any program selection: the run announced 210 min, exactly bytes 4 and 5 (3:30) of this frame, and the Auto runs announced 165 min (2:45). With a delayed start the frame is sent again right after the start command and during the wait: 0c 06 00 00 07 1e 00 (6 h delay, EasyClean) and 06 03 00 00 04 0a 00 (3 h delay, 1 h 65 C with extra drying), so bytes 4 and 5 are the total time including the delay (delay plus program time). 39 s after the start the frame read 06 02 3b 00 04 09 00: bytes 1 and 2 count the remaining delay down (2 h 59 min), byte 0 stayed 06 and bytes 4 and 5 fell by a minute to 4:09. After the delay was cancelled the frame was 00 00 00 00 01 0a 00 (program time only). The full countdown of the third recording (1 h delay): from 02 00 3b 00 03 2c 00 44 s after the start to 01 00 01 00 03 00 ... 01 00 01 00 02 2e 00, one step per minute in bytes 2 (delay minutes, 59 down to 0) and 5 (total minutes), hour bytes 1 and 4 following the borrow; byte 0 was ceil(remaining delay / 30 min) (02 down to 31 min left, 01 from 30 min left, 00 at the end). At the end of the delay the frame read 00 00 00 00 02 2d 00 (program time 2:45 only) in the same second as 27/2007 = 01. Bytes 1-2 are confirmed as the remaining delay, byte 0 as half-hour steps stays assumed"
    fields:
      - {byte: 4, kind: u8, name: nominal_h, label: Nominal hours, unit: h, status: assumed}
      - {byte: 5, kind: u8, name: nominal_m, label: Nominal minutes, unit: min, status: assumed}
      - {byte: 0, kind: u8, name: delay_left_half_hours, label: Remaining delay in half-hours, status: assumed}
      - {byte: 1, kind: u8, name: delay_left_h, label: Remaining delay hours, unit: h, status: confirmed}
      - {byte: 2, kind: u8, name: delay_left_m, label: Remaining delay minutes, unit: min, status: confirmed}
  - key: "22/7ff1"
    name: wake_up
    title: "Power-on call to the panel (repeated until acknowledged)"
    status: assumed
