# Protocol findings for the Electrolux / AEG MACS bus. Source of truth for the decoder AND the findings page.
# status: confirmed = verified (frame structure: arithmetic; values: against what was done on the appliance);
#         assumed   = plausible and consistent with the recording, not yet verified by a targeted test;
#         unknown   = seen on the bus, meaning not understood.
# Observed so far on ONE AEG heat-pump dryer in ONE recording (idle heartbeat, all programs and options stepped through,
# start, stop, power off). Everything marked "single recording" needs a second, labelled recording before it is confirmed.
# Nothing in here may contain private data (no addresses of the board, no network names, no keys).
protocol: macs
title: Electrolux / AEG MACS bus (tumble dryer)
physical: "RAST 2.5, 4 pins: 1 = +12 V, 2 = +5 V, 3 = DATA, 4 = GND. 9600 baud 8E1, inverted logic (idle 0 V), half duplex, 20 ms idle gap ends a burst"
frame: "C9 DD SS LL <payload LL bytes> XX  (DD destination, SS source, XX = XOR of all preceding bytes, frame length LL+5). First payload byte = message type. ACK = 98 <checksum byte of the message> <XOR of both>"
# Key format of a command: "<destination>/<source><type>" in hex, e.g. 2a/225f = heartbeat from 0x22 to 0x2a.
# Field byte numbers count the payload WITHOUT the type byte (byte 0 = second payload byte).
source_in_cmd: true
# Addresses are read from the frame and therefore always true. What a device IS is derived from its traffic and carries a status.
devices:
  "22":
    name: "dryer control board (main controller)"
    status: assumed
    evidence: "sends the heartbeat every 3 s and all device-state / time messages; wakes and polls device 0x30"
  "2a":
    name: "user panel (display and buttons)"
    status: assumed
    evidence: "sends program selection, start/stop and on/off; acknowledges the heartbeat; receives state and time"
  "30":
    name: "compressor / inverter board"
    status: assumed
    evidence: "answers the controller's status queries (22/3012 every 2 s) as soon as the bus is powered, also while no programme runs; announces itself with a wake-up when a run starts; identifies itself with the ASCII text M1IB1606 (message 22/3011)"
  "00":
    name: "broadcast"
    status: assumed
    evidence: "the compressor board sends its wake-up message 10 00 23 to 0x00 when it starts; single recording"
acks:
  "9":
    node: "addressed node (receiver of the acknowledged message)"
    status: assumed
    evidence: "98 is followed by the checksum byte of the message just seen (612 of 612 ACKs in the second recording); broadcast and wake-up messages (00/3010, 00/2210, 00/2a10, 30/2210) get no ACK (28 of 28 unacknowledged frames); who sends the ACK electrically was not measured"
# How telegrams are grouped into runs (program cycles). Detection is a heuristic and always marked as such.
runs:
  start:
    key: "22/2a51"          # command message from the panel
    byte: 1
    value: 0x60
    resume_after_state: {key: "2a/2252", byte: 1, value: 0x04}   # a start while the controller reports paused resumes the run
    status: assumed
    evidence: "51 00 60 00 00 1b 03 was sent when the start button was pressed; the controller then reported state 02 (running); repeated start messages within 60 s are merged; a start while the controller reports state 04 (paused) continues the same run (resume after a 3 h pause, 23:20; the resume message is identical to the start message); two recordings"
  end:
    gap_minutes: 10         # the board is powered from the bus: when the dryer switches off, telegrams stop
    status: assumed
    evidence: "no end-of-programme marker has been captured yet; the run ends with the last telegram before a silent gap (the dryer powers itself and the board off after a few minutes without use)"
  context_seconds: 300      # telegrams shown before the start (programme selection, power on)
  program_key: "22/2a50"    # programme selection used to name the run
enums:
  program:
    "0x01": "Mix Dry"
    "0x02": "Eco"
    "0x03": "Cotton"
    "0x04": "Easy care"
    "0x05": "Delicates"
    "0x06": "Bedding XL"
    "0x07": "Sportswear"
    "0x08": "Down"
    "0x09": "Light ironing"
    "0x0a": "Refresh"
  device_state:
    "0x0b": "off"
    "0x03": "starting (after power-on)"
    "0x01": "on / ready"
    "0x02": "running"
    "0x04": "paused"
  panel_action:
    "0x60": "start"
    "0x61": "programme selected (after power-on)"
    "0x62": "stop / pause"
commands:
  - key: "2a/225f"
    name: heartbeat
    title: Heartbeat (controller to panel)
    status: confirmed
    evidence: "payload 5f 03, every 3 s while the dryer is on (91 in the recording), always acknowledged"
    fields: []
  - key: "22/2a50"
    name: program_select
    title: Programme selection (panel to controller)
    status: confirmed
    evidence: "byte 7 took 10, 20, 30 ... 120 (0x0a..0x78) while the user stepped the drying time from 10 min to 2 h, then 0; with delayed start byte 8 changed 4b to cb and bytes 9-10 counted 30, 60, 90, 120, 180, 240 ... 1200 (0x1e..0x4b0) minutes, i.e. 30-min steps up to 2 h, then hourly up to 20 h, as the user read off the display; one recording. Byte 13 followed the programme button through 4, 5, 6, 7, 8, 9, 10, 1, 2; mapped from the order the user stepped through the programmes (Cotton, Easy care, Delicates, Bedding XL, Sportswear, Down, Light ironing, Refresh, Mix Dry, Eco, Cotton): 1 Mix Dry, 2 Eco, 3 Cotton, 4-10 as listed; display names are the German ones the user read off the dryer, translated"
    fields:
      - {byte: 13, kind: enum, enum: program, name: program, label: Programme number, status: confirmed}
      - {byte: 1, kind: u8, name: flags_b1, label: Varies with programme, status: unknown}
      - {byte: 5, kind: u8, name: flags_b5, label: Varies with programme, status: unknown}
      - {byte: 6, kind: u8, name: option_b6, label: Toggles 01 / 04 with one option, status: assumed}
      - {byte: 7, kind: u8, name: drying_time, label: Drying time set on the panel, unit: min, status: assumed}
      - {byte: 8, kind: u8, name: flags_b8, label: Varies with programme (4a / 4b); 0xcb while a delayed start is set, status: unknown}
      - {byte: 8, bit: 7, name: delayed_start_set, label: Delayed start set, status: assumed}
      - {byte: 9, kind: u16, name: delayed_start, label: Delayed start, unit: min, status: assumed}
      - {byte: 16, kind: u8, name: flags_b16, label: Varies with programme (07 for programme 2, else 01), status: unknown}
  - key: "22/2a55"
    name: program_data_panel
    title: Programme data / option bits (panel to controller)
    status: unknown
    evidence: "13-byte payload that changes with programme and option; nine different values in the recording; bit meaning not mapped"
    fields: []
  - key: "2a/2255"
    name: program_data_controller
    title: Programme data echo (controller to panel)
    status: assumed
    evidence: "17-byte payload sent once at the start, same layout family as the panel message; single recording"
    fields: []
  - key: "22/2a51"
    name: panel_command
    title: Panel command (start / stop)
    status: assumed
    evidence: "60 = start, 62 = stop or pause, 61 = programme selected after power-on; matches the start and stop pressed during the recording and the controller states 02 and 04 that followed; second recording: start, pause 4 s later (62), 3 h of silence, resume (60, byte-identical to the start message), off. Pause and stop share the value 62"
    # note: start and resume cannot be told apart on the wire
    fields:
      - {byte: 1, kind: enum, enum: panel_action, name: action, label: Action, status: assumed}
  - key: "22/2a53"
    name: power
    title: On / off (panel to controller)
    status: assumed
    evidence: "one message (53 03 10 02 00 00) in the recording, followed within 50 ms by device state 0b (off); the on direction and the meaning of byte 1 were not recorded"
    fields:
      - {byte: 1, kind: u8, name: power_arg, label: Argument, status: unknown}
  - key: "2a/2252"
    name: device_state
    title: Device state (controller to panel)
    status: assumed
    evidence: "byte 1: 03 right after the board gets power (about 5 s, then 01), 01 ready, 02 after start, 04 after stop, 0b when switched off (twice: 22/2a53 followed by state 0b, then the bus goes dead because the board is powered from it); two recordings"
    fields:
      - {byte: 1, kind: enum, enum: device_state, name: state, label: State, status: assumed}
      - {byte: 2, kind: u8, name: run_flag, label: 01 in states running and paused, status: unknown}
      - {byte: 6, kind: u8, name: state_b6, label: 41 normally, 43 or 03 when off or starting; toggled 41/43 about every 2.5 s while the door was opened and closed (not yet verified with a single labelled action), status: unknown}
  - key: "2a/2256"
    name: time
    title: Time (controller to panel)
    status: unknown
    evidence: "two layouts. 56 03 00 00 VV 00 CS: VV took the values af 86 5c 5a 83 50 b4 32 23 while programmes were switched, and after the start fell by exactly 1 every 60 s (ae ad ac ab aa, 13:12:53 to 13:16:53), CS = VV + 0x1e in most messages; consistent with the remaining time in minutes, but NOT yet compared with the display. 56 03 04 00 00 VV 00 80 01: VV took 50 28 14 2d 1e 0a 32, possibly the programme default; single recording"
    fields:
      - {byte: 1, kind: u8, name: layout, label: Layout (00 or 04), status: unknown}
  - key: "2a/2257"
    name: alarm
    title: Alarm
    status: unknown
    evidence: "type is listed as alarm in third-party notes for the washing machine; not seen on this dryer"
    fields: []
  - key: "22/2a11"
    name: panel_identification
    title: Identification (panel)
    status: assumed
    evidence: "sent once at power-on: 11 00 followed by the ASCII text U1CB820GZ and 12 more bytes (meaning unknown); same layout as the compressor board identification; single recording"
    fields:
      - {byte: 1, kind: ascii, length: 9, name: ident, label: Identification text, status: assumed}
  - key: "30/2210"
    name: wakeup_to_compressor
    title: Wake-up (controller to compressor board)
    status: assumed
    evidence: "10 00 24 (8 times) and 10 01 (twice) at the start of a run; the compressor board answers with its own wake-up, a broadcast 10 00 23"
    fields: []
  - key: "00/3010"
    name: wakeup_from_compressor
    title: Wake-up (compressor board, broadcast)
    status: assumed
    evidence: "10 00 23, twice, only while the compressor board starts up"
    fields: []
  - key: "22/3011"
    name: identification
    title: Identification (compressor board)
    status: confirmed
    evidence: "payload 11 00 followed by the ASCII text M1IB1606 and two more bytes (3d d4, meaning unknown)"
    fields:
      - {byte: 1, kind: ascii, length: 8, name: ident, label: Identification text, status: confirmed}
  - key: "30/2211"
    name: parameter_blocks
    title: Parameter blocks (controller to compressor board)
    status: unknown
    evidence: "four long blocks 11 03 00 .. 11 03 03 plus a short 11 01 2e 00; looks like a parameter set for the compressor board, values not interpreted"
    fields: []
  - key: "30/2212"
    name: inverter_command
    title: Inverter command (controller to compressor board)
    status: unknown
    evidence: "12 00 00 e6 06 4a 80 00 (and 81, 00 07 30 ... variants) 25 times during a run; byte 6 toggles 80/81"
    fields: []
  - key: "22/3012"
    name: inverter_status
    title: Inverter status (compressor board to controller)
    status: unknown
    evidence: "19-byte payload roughly every 2 s during a run, 13 different values; bytes 8 and 9 change slowly (18 / 19 / 20, 00..02), others stay 00; no compressor values (speed, temperatures) mapped yet"
    fields: []
  - key: "30/2214"
    name: query_14
    title: Query 0x14 (controller to compressor board)
    status: unknown
    evidence: "14 00 ff ff, eight times, each answered by 14 01 00"
    fields: []
  - key: "22/3014"
    name: query_14_answer
    title: Answer to query 0x14 (compressor board)
    status: unknown
    evidence: "14 01 00, always right after the query"
    fields: []
