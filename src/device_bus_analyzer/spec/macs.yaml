# Protocol findings for the Electrolux / AEG MACS bus. Source of truth for the decoder AND the findings page.
# status: confirmed = verified (frame structure: arithmetic; values: against what was done on the appliance);
#         assumed   = plausible and consistent with the recording, not yet verified by a targeted test;
#         unknown   = seen on the bus, meaning not understood.
# Observed so far on ONE AEG heat-pump dryer (first recording: idle heartbeat, all programs and options stepped through,
# start, stop, power off; later recordings: pause/resume, a complete wet run from start to self power-off, and a short run
# with laundry that was already dry). Everything marked "single recording" needs a second, labelled recording first.
# Nothing in here may contain private data (no addresses of the board, no network names, no keys).
protocol: macs
title: Electrolux / AEG MACS bus (tumble dryer)
physical: "RAST 2.5, 4 pins: 1 = +12 V, 2 = +5 V, 3 = DATA, 4 = GND. 9600 baud 8E1, inverted logic (idle 0 V), half duplex, 20 ms idle gap ends a burst"
frame: "C9 DD SS LL <payload LL bytes> XX  (DD destination, SS source, XX = XOR of all preceding bytes, frame length LL+5). First payload byte = message type. ACK = 98 <checksum byte of the message> <XOR of both>"
# Key format of a command: "<destination>/<source><type>" in hex, e.g. 2a/225f = heartbeat from 0x22 to 0x2a.
# Field byte numbers count the payload WITHOUT the type byte (byte 0 = second payload byte).
source_in_cmd: true
# Addresses are read from the frame and therefore always true. What a device IS is derived from its traffic and carries a status.
devices:
  "22":
    name: "dryer control board (main controller)"
    status: assumed
    evidence: "sends the heartbeat every 3 s and all device-state / time messages; wakes and polls device 0x30"
  "2a":
    name: "user panel (display and buttons)"
    status: assumed
    evidence: "sends program selection, start/stop and on/off; acknowledges the heartbeat; receives state and time"
  "30":
    name: "motor inverter board (drum motor)"
    status: assumed
    evidence: "answers the controller's status queries (22/3012 every 2 s) as soon as the bus is powered, also while no programme runs; announces itself with a wake-up when a run starts; identifies itself with the ASCII text M1IB1606 (message 22/3011). Its command 30/2212 carries a signed speed set point (+1840 / +2760, -1840 / -2760 for reversing, +-1932 in the anti-crease phase) and its status reports the actual speed, so it drives the drum motor; whether it also drives the compressor is unknown (two full runs)"
  "00":
    name: "broadcast"
    status: assumed
    evidence: "the motor inverter board sends its wake-up message 10 00 23 to 0x00 when it starts; single recording"
acks:
  "9":
    node: "addressed node (receiver of the acknowledged message)"
    status: assumed
    evidence: "98 is followed by the checksum byte of the message just seen (612 of 612 ACKs in the second recording); broadcast and wake-up messages (00/3010, 00/2210, 00/2a10, 30/2210) get no ACK (28 of 28 unacknowledged frames); who sends the ACK electrically was not measured"
# How telegrams are grouped into runs (program cycles). Detection is a heuristic and always marked as such.
runs:
  start:
    key: "22/2a51"          # command message from the panel
    byte: 1
    value: 0x60
    resume_after_state: {key: "2a/2252", byte: 1, value: 0x04}   # a start while the controller reports paused resumes the run
    status: assumed
    evidence: "51 00 60 00 00 1b 03 was sent when the start button was pressed; the controller then reported state 02 (running); repeated start messages within 60 s are merged; a start while the controller reports state 04 (paused) continues the same run (resume after a 3 h pause, 23:20; the resume message is identical to the start message); two recordings"
  end:
    marker:                 # first device state after the start that is idle (03), cancelled (09) or off (0b)
      key: "2a/2252"
      byte: 1
      values: [0x03, 0x09, 0x0b]
      status: assumed
      evidence: "a complete run ended with state 03 (byte 8 = 70) right after the anti-crease countdown reached 0, then the dryer switched itself off about 5 min later (22/2a53 = 10, state 0b); a run with dry laundry ended after about 5 min with state 03 (byte 8 = 40); cancelling in the ready state gave 09; switching off during a run gives 0b; two complete runs"
    gap_minutes: 10         # the board is powered from the bus: when the dryer switches off, telegrams stop
    gap_ends_run: true      # a silent gap ends the run even if a marker follows much later (the board was off)
    status: assumed
    evidence: "fallback when no end state was recorded: the run ends with the last telegram before a silent gap (the dryer powers itself and the board off a few minutes after the end)"
  fallback_start:           # Plan B when the start command was missed (the board boots for about 18 s after power-on)
    key: "30/2212"
    byte: 1
    length: 2
    nonzero: true           # drum speed set point not zero = a programme is running
    status: assumed
    evidence: "start command not recorded; the run starts at the first drum command with a speed set point outside every detected run. The drum only turns while a programme runs (two complete runs: from the start until the end of the anti-crease phase, idle 00 00 otherwise). A recorded start within 300 s after it takes precedence"
  context_seconds: 300      # telegrams shown before the start (programme selection, power on)
  program_key: "22/2a50"    # programme selection used to name the run
  remaining_key: "2a/2256"  # remaining time in minutes as shown on the display
  remaining_byte: 3
  remaining_when: {byte: 1, value: 0x00}
enums:
  program:
    "0x01": "Mix Dry"
    "0x02": "Eco"
    "0x03": "Cotton"
    "0x04": "Easy care"
    "0x05": "Delicates"
    "0x06": "Bedding XL"
    "0x07": "Sportswear"
    "0x08": "Down"
    "0x09": "Light ironing"
    "0x0a": "Refresh"
  device_state:
    "0x0b": "off"
    "0x03": "idle (after power-on or programme ended)"
    "0x01": "on / ready"
    "0x02": "running"
    "0x04": "paused"
    "0x09": "cancelled"
  run_phase:
    "0x00": "none"
    "0x01": "drying"
    "0x02": "cooling"
    "0x04": "anti-crease"
  end_type:
    "0x00": "none"
    "0x40": "ended early (laundry already dry)"
    "0x70": "ended normally (after anti-crease)"
  time_layout:
    "0x00": "remaining time"
    "0x02": "ready / idle counter"
    "0x03": "end summary"
    "0x04": "programme default"
    "0x05": "anti-crease countdown"
  power_arg:
    "0x00": "synchronise (power-on)"
    "0x10": "off"
    "0x20": "off after cancel"
  panel_action:
    "0x60": "start"
    "0x61": "programme selected (after power-on)"
    "0x62": "stop / pause"
commands:
  - key: "2a/225f"
    name: heartbeat
    title: Heartbeat (controller to panel)
    status: confirmed
    evidence: "payload 5f 03, every 3 s while the dryer is on (91 in the recording), always acknowledged"
    fields: []
  - key: "22/2a50"
    name: program_select
    title: Programme selection (panel to controller)
    status: confirmed
    evidence: "byte 7 took 10, 20, 30 ... 120 (0x0a..0x78) while the user stepped the drying time from 10 min to 2 h, then 0; with delayed start byte 8 changed 4b to cb and bytes 9-10 counted 30, 60, 90, 120, 180, 240 ... 1200 (0x1e..0x4b0) minutes, i.e. 30-min steps up to 2 h, then hourly up to 20 h, as the user read off the display; one recording. Byte 13 followed the programme button through 4, 5, 6, 7, 8, 9, 10, 1, 2; mapped from the order the user stepped through the programmes (Cotton, Easy care, Delicates, Bedding XL, Sportswear, Down, Light ironing, Refresh, Mix Dry, Eco, Cotton): 1 Mix Dry, 2 Eco, 3 Cotton, 4-10 as listed; display names are the German ones the user read off the dryer, translated"
    fields:
      - {byte: 13, kind: enum, enum: program, name: program, label: Programme number, status: confirmed}
      - {byte: 1, kind: u8, name: flags_b1, label: Varies with programme, status: unknown}
      - {byte: 5, kind: u8, name: flags_b5, label: Varies with programme, status: unknown}
      - {byte: 6, kind: u8, name: option_b6, label: Toggles 01 / 04 with one option, status: assumed}
      - {byte: 7, kind: u8, name: drying_time, label: Drying time set on the panel, unit: min, status: assumed}
      - {byte: 8, kind: u8, name: flags_b8, label: Varies with programme (4a / 4b); 0xcb while a delayed start is set, status: unknown}
      - {byte: 8, bit: 7, name: delayed_start_set, label: Delayed start set, status: assumed}
      - {byte: 9, kind: u16, name: delayed_start, label: Delayed start, unit: min, status: assumed}
      - {byte: 16, kind: u8, name: flags_b16, label: Varies with programme (07 for programme 2, else 01), status: unknown}
  - key: "22/2a55"
    name: program_data_panel
    title: Programme data / option bits (panel to controller)
    status: unknown
    evidence: "13-byte payload that changes with programme and option; nine different values in the recording; bit meaning not mapped"
    fields: []
  - key: "2a/2255"
    name: program_data_controller
    title: Programme data echo (controller to panel)
    status: assumed
    evidence: "17-byte payload sent once at the start, same layout family as the panel message; single recording"
    fields: []
  - key: "22/2a51"
    name: panel_command
    title: Panel command (start / stop)
    status: assumed
    evidence: "60 = start, 62 = stop or pause, 61 = programme selected after power-on; matches the start and stop pressed during the recording and the controller states 02 and 04 that followed; second recording: start, pause 4 s later (62), 3 h of silence, resume (60, byte-identical to the start message), off. Pause and stop share the value 62"
    # note: start and resume cannot be told apart on the wire
    fields:
      - {byte: 1, kind: enum, enum: panel_action, name: action, label: Action, status: assumed}
  - key: "22/2a53"
    name: power
    title: On / off (panel to controller)
    status: assumed
    evidence: "53 03 10 02 00 00 is followed within 50 ms by device state 0b (off): when the off button is pressed and also when the dryer switches itself off about 5 min after the end of a programme (twice); 53 03 20 02 00 00 followed by state 0b came 6 s after a cancel (state 09); 53 03 00 02 00 00 is sent once at power-on and answered by the controller with 2a/2253 03 00 02 00 00"
    fields:
      - {byte: 1, kind: enum, enum: power_arg, name: power_arg, label: Argument, status: assumed}
  - key: "2a/2252"
    name: device_state
    title: Device state (controller to panel)
    status: assumed
    evidence: "sent only when something changes. Byte 1: 03 right after the board gets power (about 5 s, then 01) and again when a programme has ended, 01 ready, 02 after start, 04 after stop, 09 after a cancel in the ready state, 0b when switched off (22/2a53 followed by state 0b, then the bus goes dead because the board is powered from it). Byte 2 during a run: 01 at the start, 02 when the temperature began to fall about 40 min before the drying end (cooling), 04 when the remaining time reached 0 and the drum started the anti-crease pattern; byte 5 was 05 in the cooling phase. Byte 8: 70 after a complete run with anti-crease, 40 after a run that stopped after 5 min with laundry that was already dry; one run each"
    fields:
      - {byte: 1, kind: enum, enum: device_state, name: state, label: State, status: assumed}
      - {byte: 2, kind: enum, enum: run_phase, name: phase, label: Programme phase, status: assumed}
      - {byte: 5, kind: u8, name: state_b5, label: 05 in the cooling phase, status: unknown}
      - {byte: 6, kind: u8, name: state_b6, label: 41 normally, 43 or 03 when off or starting; toggled 41/43 about every 2.5 s while the door was opened and closed (not yet verified with a single labelled action), status: unknown}
      - {byte: 8, kind: enum, enum: end_type, name: end_type, label: How the programme ended, status: assumed}
  - key: "2a/2256"
    name: time
    title: Time (controller to panel)
    status: assumed
    evidence: "byte 1 selects the layout. Layout 00: byte 3 is the remaining time in minutes exactly as shown on the display (af = 2:55 for Eco and 86 = 2:14 for Cotton when selected; ad = 2:53 at the moment the display changed to 2:53 after the start); during a wet run it was re-estimated several times (up and down) and counted down to 0; byte 5 is a second minute counter, 30 above byte 3 at the start, updated 30 s after byte 3, meaning unknown. Layout 05 counts down once a minute from 1d (29) to 0 during the anti-crease phase. Layout 02 is sent while ready: bytes 2-3 fall by 6 per minute, only while the dryer is on. Layout 03 (1d f6 00 f7 and similar) appears once at the end of a run. Layout 04: byte 4 took 50 28 14 2d 1e 0a 32, possibly the programme default"
    fields:
      - {byte: 1, kind: enum, enum: time_layout, name: layout, label: Layout, status: assumed}
      - {byte: 3, kind: u8, name: remaining, label: Remaining time, unit: min, when: {byte: 1, value: 0x00}, status: confirmed}
      - {byte: 5, kind: u8, name: counter_b5, label: Second minute counter, unit: min, when: {byte: 1, value: 0x00}, status: unknown}
      - {byte: 2, kind: u8, name: anti_crease_remaining, label: Anti-crease remaining, unit: min, when: {byte: 1, value: 0x05}, status: assumed}
      - {byte: 2, kind: u16, name: idle_counter, label: Counter while ready (falls by 6 per minute), when: {byte: 1, value: 0x02}, status: unknown}
      - {byte: 4, kind: u8, name: programme_default, label: Possibly the programme default, when: {byte: 1, value: 0x04}, status: unknown}
  - key: "2a/2257"
    name: alarm
    title: Alarm
    status: unknown
    evidence: "type is listed as alarm in third-party notes for the washing machine; on this dryer only 57 03 00 00 00 00 was seen, once per power-on, probably 'no alarm'"
    fields: []
  - key: "22/2a11"
    name: panel_identification
    title: Identification (panel)
    status: assumed
    evidence: "sent once at power-on: 11 00 followed by the ASCII text U1CB820GZ and 12 more bytes (meaning unknown); same layout as the motor inverter board identification; single recording"
    fields:
      - {byte: 1, kind: ascii, length: 9, name: ident, label: Identification text, status: assumed}
  - key: "30/2210"
    name: wakeup_to_compressor
    title: Wake-up (controller to motor inverter board)
    status: assumed
    evidence: "10 00 24 (8 times) and 10 01 (twice) at the start of a run; the motor inverter board answers with its own wake-up, a broadcast 10 00 23"
    fields: []
  - key: "00/3010"
    name: wakeup_from_compressor
    title: Wake-up (motor inverter board, broadcast)
    status: assumed
    evidence: "10 00 23, twice, only while the motor inverter board starts up"
    fields: []
  - key: "22/3011"
    name: identification
    title: Identification (motor inverter board)
    status: confirmed
    evidence: "payload 11 00 followed by the ASCII text M1IB1606 and two more bytes (3d d4, meaning unknown)"
    fields:
      - {byte: 1, kind: ascii, length: 8, name: ident, label: Identification text, status: confirmed}
  - key: "30/2211"
    name: parameter_blocks
    title: Parameter blocks (controller to motor inverter board)
    status: unknown
    evidence: "four long blocks 11 03 00 .. 11 03 03 plus a short 11 01 2e 00; looks like a parameter set for the motor inverter board, sent at every start, values not interpreted"
    fields: []
  - key: "30/2212"
    name: inverter_command
    title: Drum command (controller to motor inverter board)
    status: unknown
    evidence: "sent about every 2 s while the bus is powered and changed whenever the drum changes: bytes 1-2 are a signed speed set point (07 30 = +1840 at the start, 0a c8 = +2760 with wet laundry, f5 38 / f8 d0 = -2760 / -1840 for a short reversal every 40 min, 07 8c / f8 74 = +-1932 for 5 s every 33 s in the anti-crease phase, 00 00 = stop); the status 22/3012 reports the same value as actual speed. Bytes 3-4 are 06 4a while turning and 09 e2 when stopping (ramp or braking profile?); byte 5 is 01 while the drum is enabled. 00 00 e6 06 4a 80 00 is the idle command before the start and after the end; two complete runs"
    fields:
      - {byte: 1, kind: s16, name: speed_setpoint, label: Drum speed set point (sign = direction), status: assumed}
      - {byte: 3, kind: u16, name: profile, label: 064a turning / 09e2 stopping, status: unknown}
      - {byte: 5, kind: u8, name: enable, label: 01 while the drum is enabled, status: assumed}
  - key: "22/3012"
    name: inverter_status
    title: Drum status (motor inverter board to controller)
    status: unknown
    evidence: "19-byte payload every 2 s while the bus is powered. Bytes 1-2: actual drum speed in the low 15 bits (8a c9 = 2761 for set point 2760, 87 8b = 1931 for 1932, 80 00 = stopped), bit 15 set once the set point is reached (clear while ramping up: 00 8c = 140). Bytes 3-4: current ramp set point. Byte 7: rose from 29 to 55 during drying and fell from 52 to 36 in the cooling and anti-crease phases, a temperature in deg C. Bytes 8-9 about 735 peak while starting, 300-400 at speed, 2-10 at rest (motor current?); bytes 10-11 follow them with a delay (power or torque?). Bytes 14-15 and 16-17: fell from about 320 to 120 during a wet run of 4.5 h, were 62-66 from the first minute with laundry that was already dry (the dryer then ended after 5 min), are 0 while the drum stops or reverses and during the whole anti-crease phase: the laundry moisture measurement (two channels); two runs"
    fields:
      - {byte: 1, kind: u16, mask: 0x7fff, name: speed, label: Drum speed (actual), status: assumed}
      - {byte: 1, bit: 7, name: at_setpoint, label: Speed set point reached, status: assumed}
      - {byte: 3, kind: s16, name: speed_ramp, label: Current ramp set point, status: assumed}
      - {byte: 7, kind: u8, name: temperature, label: Temperature, unit: "deg C", status: assumed}
      - {byte: 8, kind: u16, name: motor_current, label: Motor current (raw), status: assumed}
      - {byte: 10, kind: u16, name: motor_load, label: Follows the current with a delay (raw), status: unknown}
      - {byte: 14, kind: u16, name: moisture_a, label: Laundry moisture, channel A (raw), status: assumed}
      - {byte: 16, kind: u16, name: moisture_b, label: Laundry moisture, channel B (raw), status: assumed}
  - key: "30/2214"
    name: query_14
    title: Query 0x14 (controller to motor inverter board)
    status: unknown
    evidence: "14 00 ff ff, eight times, each answered by 14 01 00"
    fields: []
  - key: "22/3014"
    name: query_14_answer
    title: Answer to query 0x14 (motor inverter board)
    status: unknown
    evidence: "14 01 00, always right after the query"
    fields: []
  - key: "2a/2211"
    name: controller_identification
    title: Identification (controller to panel)
    status: unknown
    evidence: "11 01, once per power-on right after the panel identification"
    fields: []
  - key: "2a/2253"
    name: power_echo
    title: On / off echo (controller to panel)
    status: assumed
    evidence: "53 03 00 02 00 00 once per power-on, right after the panel sent the same 22/2a53 message"
    fields: []
  - key: "2a/2210"
    name: wakeup_to_panel
    title: Wake-up (controller to panel)
    status: unknown
    evidence: "once per power-on, together with 00/2210 and 00/2a10"
    fields: []
  - key: "00/2210"
    name: wakeup_from_controller
    title: Wake-up (controller, broadcast)
    status: unknown
    evidence: "once per power-on, not acknowledged"
    fields: []
  - key: "00/2a10"
    name: wakeup_from_panel
    title: Wake-up (panel, broadcast)
    status: unknown
    evidence: "once per power-on, not acknowledged"
    fields: []
